<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jaymart Shift ตารางกะการทำงาน</title>

<meta name="description" content="Jaymart Shift ตารางกะการทำงานพนักงาน">
<meta name="theme-color" content="#0b1220">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">

<!-- Social preview -->
<meta property="og:title" content="Jaymart Shift ตารางกะการทำงาน">
<meta property="og:description" content="ระบบจัดการและเช็กตารางกะการทำงาน">
<meta property="og:type" content="website">

<!-- Favicon แบบ emoji (ไม่ต้องมีไฟล์รูป) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">

<!-- PWA: เปิดจาก Home Screen แบบเต็มจอ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jaymart Shift">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;              /* กัน address bar บนมือถือบัง */
    overflow: hidden;            /* ไม่มี scrollbar */
    background: #ffffff;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* กรอบครอบ iframe: ตัดส่วนเกิน (แถบ Google) ทิ้ง */
  #frameWrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    border: 0;
  }

  /* สูงเกินจอ ~40px เพื่อดันแถบ "สร้างโดยผู้ใช้ Google Apps Script" ให้ตกขอบล่าง */
  #appFrame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% + 40px);
    height: calc(100dvh + 40px);
    border: 0;
    display: block;
    background: #ffffff;
  }

  /* ---------- Loading screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(160deg, #0b1220 0%, #1b2440 100%);
    z-index: 9999;
    opacity: 1;
    transition: opacity .45s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #loader.hide { opacity: 0; pointer-events: none; }

  .calendar-icon {
    font-size: 42px;
    line-height: 1;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.08); opacity: .8; }
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255, 255, 255, .18);
    border-top-color: #e4002b;   /* สีแบรนด์ */
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-title {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun",
                 "Noto Sans Thai", Roboto, sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: .3px;
    text-align: center;
  }
  .loader-sub {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun",
                 "Noto Sans Thai", Roboto, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, .62);
    letter-spacing: .2px;
  }
</style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="calendar-icon">📅</div>
    <div class="spinner"></div>
    <div class="loader-title">Jaymart Shift ตารางกะการทำงาน</div>
    <div class="loader-sub">กำลังโหลดข้อมูลกะ…</div>
  </div>

  <!-- App -->
  <div id="frameWrap">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbxEeT88cp3HWwPwvo1VI8xo2l2dInsecLf0wi7IEmNAFdGdDN4OMMUGppLceaeg8LbE4g/exec?v=1"
      title="Jaymart Shift ตารางกะการทำงาน"
      allow="fullscreen; clipboard-read; clipboard-write; geolocation"
      allowfullscreen
      referrerpolicy="no-referrer"
      scrolling="no"
      frameborder="0"></iframe>
  </div>

<script>
  (function () {
    var loader = document.getElementById('loader');
    var wrap   = document.getElementById('frameWrap');
    var frame  = document.getElementById('appFrame');
    var OVERLAP = 40;           // ระยะดันแถบ Google ให้ตกขอบล่าง
    var done = false;

    function hideLoader() {
      if (done) return;
      done = true;
      loader.classList.add('hide');
      setTimeout(function () { loader.style.display = 'none'; }, 500);
    }

    frame.addEventListener('load', function () {
      setTimeout(hideLoader, 400);   // หน่วงให้ app ข้างใน render เสร็จก่อน
    });

    setTimeout(hideLoader, 12000);   // กันเหนียว ถ้า onload ไม่ยิง

    // แก้ความสูงเพี้ยนตอนหมุนจอ / address bar ยุบ-ขยาย
    function fixHeight() {
      var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      wrap.style.height  = h + 'px';
      frame.style.height = (h + OVERLAP) + 'px';
    }
    window.addEventListener('resize', fixHeight);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fixHeight);
    window.addEventListener('orientationchange', function () { setTimeout(fixHeight, 300); });
    fixHeight();

    // กัน pinch-zoom / double-tap zoom บน iOS
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  })();
</script>
</body>
</html>
